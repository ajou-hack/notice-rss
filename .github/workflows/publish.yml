name: publish

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 * * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Diagnose notice endpoint
        run: |
          for NOTICE_HOST in ajou.ac.kr www.ajou.ac.kr; do
            echo "::group::HTTPS connectivity: $NOTICE_HOST"
            getent ahosts "$NOTICE_HOST" || true
            curl --verbose --location \
              --connect-timeout 10 --max-time 35 \
              --user-agent 'Mozilla/5.0' \
              --output /dev/null \
              --write-out '\nremote_ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total} status=%{http_code}\n' \
              "https://$NOTICE_HOST/kr/ajou/notice.do?mode=list&articleLimit=30&article.offset=0" || true
            echo "::endgroup::"
          done
      - name: publish
        run: |
          git config --global user.name 'ajou-hack-bot'
          git config --global user.email 'bot@ajou-hack.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ajou-hack/notice-rss
          cargo build --release
          LAST_INDEX=$(cat ./last_index)
          XML=$(./target/release/notice-rss $LAST_INDEX xml)
          CM=$(./target/release/notice-rss $LAST_INDEX cm)
          if [ -z "$XML" ] || [ -z "$CM" ]; then
          echo "new notices not found"
          exit 0
          fi
          echo $XML > rss.xml
          cat ./target/release/last_index > ./last_index
          git add -A
          git commit -m "$CM"
          git push origin master

